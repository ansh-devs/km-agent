name: Publish host agent image to the registry

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  build_and_pub:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version
        id: get_version
        run: |
          VERSION_NUMBER=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "Using release tag version: $VERSION_NUMBER"
          echo "VERSION=$VERSION_NUMBER" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Configure Git for private repos
        run: git config --global url."https://${{ secrets.GHCR_PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Clone and generate eBPF modules
        run: |
          mkdir -p build-modules/km-ebpf
          git clone https://github.com/kloudmate/kloudmate-ebpf-programs.git build-modules/km-ebpf
          cd build-modules/km-ebpf && make docker-generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kloudmate
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kloudmate/km-agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=raw,value=dev,enable=${{ github.event.release.prerelease == true }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GHCR_PAT=${{ secrets.GHCR_PAT }}
