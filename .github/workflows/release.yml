name: Build and Upload Release Assets

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-assets:
    name: Build and Upload Assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, windows]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Install Linux packaging tools
        if: matrix.target != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg2
      - name: Determine Version
        id: get_version
        run: |
          VERSION_NUMBER=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "Using release tag version: $VERSION_NUMBER"
          echo "VERSION=$VERSION_NUMBER" >> $GITHUB_ENV
      - name: Configure Git for private repos
        if: matrix.target != 'windows'
        run: git config --global url."https://x-access-token:${{ secrets.GHCR_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Clone private modules
        if: matrix.target != 'windows'
        env:
          GOPRIVATE: github.com/kloudmate/*
          GONOSUMDB: github.com/kloudmate/*
        run: |
          sudo mkdir -p /build/modules
          sudo chown -R $USER:$USER /build
          git clone https://github.com/kloudmate/kloudmate-ebpf-programs.git /build/modules/km-ebpf
          cd /build/modules/km-ebpf && make docker-generate
          cd ${{ github.workspace }}
          go mod tidy
      - name: Build Linux packages (amd64)
        if: matrix.target == 'linux-amd64'
        run: |
          make VERSION=${{ env.VERSION }} GOARCH=amd64 package-linux-deb
          make VERSION=${{ env.VERSION }} GOARCH=amd64 package-linux-rpm
      - name: Build Linux packages (arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          make VERSION=${{ env.VERSION }} GOARCH=arm64 package-linux-deb
          make VERSION=${{ env.VERSION }} GOARCH=arm64 package-linux-rpm
      - name: Reclaim ownership of build artifacts
        if: matrix.target != 'windows'
        run: sudo chown -R $USER:$USER dist/
      - name: Import GPG Key for Signing
        if: matrix.target != 'windows'
        run: |
          GNUPGHOME=/home/runner/.gnupg
          mkdir -p $GNUPGHOME
          chmod 700 $GNUPGHOME
          echo -n "${{ secrets.RPM_GPG_PASSPHRASE }}" > $GNUPGHOME/passphrase
          chmod 600 $GNUPGHOME/passphrase
          printf 'no-tty\nbatch\nuse-agent\npinentry-mode loopback\npassphrase-file %s/passphrase\n' "$GNUPGHOME" > $GNUPGHOME/gpg.conf
          echo "${{ secrets.RPM_GPG_PRIVATE_KEY }}" | GNUPGHOME=$GNUPGHOME gpg --batch --import
          echo "=== GPG conf ==="
          cat $GNUPGHOME/gpg.conf
          echo "=== Passphrase file exists ==="
          ls -la $GNUPGHOME/passphrase
          echo "=== Test GPG signing ==="
          echo "test" | GNUPGHOME=$GNUPGHOME gpg --batch --no-tty --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase --armor --sign -u "amitava@kloudmate.com" 2>&1 || echo "GPG sign test failed"
      - name: Sign Linux RPM packages
        if: matrix.target != 'windows'
        run: |
          export GNUPGHOME=/home/runner/.gnupg
          export GPG_TTY=/dev/null
          export GPG_BATCH=1
          for rpm in dist/rpm-*/RPMS/*/*.rpm; do
            if [ -f "$rpm" ]; then
              echo "Signing $rpm..."
              rpm --define "_gpg_name amitava@kloudmate.com" \
                  --define "_gpg_passphrase_file /home/runner/.gnupg/passphrase" \
                  --define "_gpg_sign_cmd %%{__gpg} gpg --batch --no-tty --pinentry-mode loopback --passphrase-file /home/runner/.gnupg/passphrase --sign --armor --detach-sign --local-user %%{_gpg_name}" \
                  --resign "$rpm" 2>&1
              rpm --checksig -v "$rpm" 2>&1
            fi
          done
      - name: Build Windows Installer package (using Docker via make)
        if: matrix.target == 'windows'
        run: make VERSION=${{ env.VERSION }} package-windows
      - name: List build artifacts
        run: |
          ls -l dist/ || true
          ls -l dist/rpm-x86_64/RPMS/x86_64/ || true
          ls -l dist/rpm-aarch64/RPMS/aarch64/ || true
          ls -l dist/win/ || true
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/*.deb
            dist/rpm-*/RPMS/*/*.rpm
            dist/win/*.exe
