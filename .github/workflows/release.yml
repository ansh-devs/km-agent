name: Build and Upload Release Assets

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-assets:
    name: Build and Upload Assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, windows]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Install Linux packaging tools
        if: matrix.target != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Determine Version
        id: get_version
        run: |
          VERSION_NUMBER=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "Using release tag version: $VERSION_NUMBER"
          echo "VERSION=$VERSION_NUMBER" >> $GITHUB_ENV
      - name: Configure Git for private repos
        if: matrix.target != 'windows'
        run: git config --global url."https://x-access-token:${{ secrets.GHCR_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Clone private modules
        if: matrix.target != 'windows'
        env:
          GOPRIVATE: github.com/kloudmate/*
          GONOSUMDB: github.com/kloudmate/*
        run: |
          sudo mkdir -p /build/modules
          sudo chown -R $USER:$USER /build
          git clone https://github.com/kloudmate/kloudmate-ebpf-programs.git /build/modules/km-ebpf
          cd /build/modules/km-ebpf && make docker-generate
          cd ${{ github.workspace }}
          go mod tidy
      - name: Build Linux packages (amd64)
        if: matrix.target == 'linux-amd64'
        run: |
          make VERSION=${{ env.VERSION }} GOARCH=amd64 package-linux-deb
          make VERSION=${{ env.VERSION }} GOARCH=amd64 package-linux-rpm
      - name: Build Linux packages (arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          make VERSION=${{ env.VERSION }} GOARCH=arm64 package-linux-deb
          make VERSION=${{ env.VERSION }} GOARCH=arm64 package-linux-rpm
      - name: Reclaim ownership of build artifacts
        if: matrix.target != 'windows'
        run: sudo chown -R $USER:$USER dist/
      - name: Import GPG Key for Signing
        if: matrix.target != 'windows'
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg-agent.conf <<EOF
          allow-loopback-pinentry
          default-cache-ttl 86400
          max-cache-ttl 86400
          EOF
          cat > ~/.gnupg/gpg.conf <<EOF
          use-agent
          no-tty
          batch
          pinentry-mode loopback
          passphrase-file /home/runner/.gnupg/passphrase
          EOF
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          echo -n "${{ secrets.RPM_GPG_PASSPHRASE }}" > ~/.gnupg/passphrase
          chmod 600 ~/.gnupg/passphrase
          echo "${{ secrets.RPM_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "=== Imported GPG keys ==="
          gpg --list-secret-keys
          FINGERPRINT=$(gpg --list-secret-keys --with-colons "amitava@kloudmate.com" | grep "^fpr" | head -1 | cut -d: -f10)
          echo "Fingerprint: $FINGERPRINT"
          echo "$FINGERPRINT:6:" | gpg --import-ownertrust
          echo "=== Exporting public key for rpm ==="
          gpg --armor --export "amitava@kloudmate.com" > /tmp/gpg-public-key.asc
          cat /tmp/gpg-public-key.asc | head -5
          rpm --import /tmp/gpg-public-key.asc
          rm /tmp/gpg-public-key.asc
      - name: Sign Linux RPM packages
        if: matrix.target != 'windows'
        run: |
          echo "=== RPM sigs before signing ==="
          rpm --checksig -v dist/rpm-*/RPMS/*/*.rpm 2>&1 || true
          echo "=== RPM keyring ==="
          rpm -qa gpg-pubkey
          echo "=== GPG key info ==="
          gpg --list-keys --with-colons "amitava@kloudmate.com"
          echo "=== RPM keyring after import ==="
          rpm -qa gpg-pubkey
          for rpm in dist/rpm-*/RPMS/*/*.rpm; do
            if [ -f "$rpm" ]; then
              echo "Signing $rpm..."
              rpmsign \
                --define "_gpg_name amitava@kloudmate.com" \
                --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback" \
                --addsign "$rpm"
              echo "=== Checking signature ==="
              rpm --checksig -v "$rpm"
            fi
          done
      - name: Build Windows Installer package (using Docker via make)
        if: matrix.target == 'windows'
        run: make VERSION=${{ env.VERSION }} package-windows
      - name: List build artifacts
        run: |
          ls -l dist/ || true
          ls -l dist/rpm-x86_64/RPMS/x86_64/ || true
          ls -l dist/rpm-aarch64/RPMS/aarch64/ || true
          ls -l dist/win/ || true
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/*.deb
            dist/rpm-*/RPMS/*/*.rpm
            dist/win/*.exe
