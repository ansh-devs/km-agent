# This config file will be used by the KM-Agent on it's first initialization.
---
receivers:
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
        cpu_average: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: basic
  otlphttp:
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 10000
    endpoint: "${env:KM_COLLECTOR_ENDPOINT}"
    headers:
      Authorization: "${env:KM_API_KEY}"
processors:
  batch:
    send_batch_size: 10000
    timeout: 10s
  resource:
    attributes:
    - key: service.name
      action: insert
      from_attribute: host.name
extensions: 
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers:
      - otlp
      - hostmetrics
      processors:
      - resource
      - batch
      exporters:
      - debug
      - otlphttp
    logs:
      receivers:
      - otlp
      processors:
      - resource
      - batch
      exporters:
      - debug
      - otlphttp
    traces:
      receivers:
      - otlp
      processors:
      - resource
      - batch
      exporters:
      - debug
      - otlphttp