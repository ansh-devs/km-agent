# =============================================================================
# KloudMate Agent - Production Inventory
# =============================================================================
# Usage:
#   ansible-playbook -i inventories/production.ini deploy-kmagent.yml \
#     -e "km_api_key=YOUR_KEY km_endpoint=https://ingest.kloudmate.com"
# =============================================================================

# --- AWS VMs ---
[aws]
aws-web-01      ansible_host=10.0.1.10
aws-web-02      ansible_host=10.0.1.11
aws-worker-01   ansible_host=10.0.2.10

[aws:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/aws-prod.pem

# --- GCP VMs ---
[gcp]
gcp-api-01      ansible_host=10.128.0.10
gcp-api-02      ansible_host=10.128.0.11

[gcp:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/gcp-prod.pem

# --- Azure VMs ---
[azure]
azure-app-01    ansible_host=10.1.0.10
azure-app-02    ansible_host=10.1.0.11

[azure:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/azure-prod.pem

# --- DigitalOcean VMs ---
[digitalocean]
do-node-01      ansible_host=167.71.xx.xx
do-node-02      ansible_host=167.71.xx.xx

[digitalocean:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/do-prod.pem

# --- On-premises ---
[onprem]
dc-node-01      ansible_host=192.168.1.100
dc-node-02      ansible_host=192.168.1.101

[onprem:vars]
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/dc-prod.pem

# --- Group all servers ---
[all:vars]
km_api_key="{{ lookup('env', 'KM_API_KEY') }}"
km_endpoint=https://ingest.kloudmate.com
kmagent_log_level=info
kmagent_tags={ "env": "production", "managed_by": "ansible" }

# --- Optional: group by role for different configs ---
[webservers:children]
aws
gcp

[workers:children]
azure
onprem
