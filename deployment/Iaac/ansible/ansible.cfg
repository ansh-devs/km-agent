[defaults]
inventory = inventories/production.ini
roles_path = roles
host_key_checking = False
timeout = 30
forks = 50
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-facts-cache
fact_caching_timeout = 3600

# Retry failed hosts
retry_files_enabled = True
retry_files_save_path = /tmp/ansible-retries

# SSH optimizations for large fleets
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path_dir = /tmp/ansible-ssh-%%h-%%p-%%r

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
